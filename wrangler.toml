# Cloudflare configuration for StudySpot
# This file defines the build and deployment configuration for Cloudflare Pages
# See: https://developers.cloudflare.com/pages/configuration/build-configuration/

name = "studyspot"
compatibility_date = "2025-12-15"

# For Cloudflare Pages, this specifies where the build output is located
# The build process will create files in ./output/wwwroot which will be deployed
pages_build_output_dir = "./output/wwwroot"

# Build configuration
# This command will be executed during the Cloudflare Pages build process
[build]
command = "./build.sh"

# Note: Environment variables should be configured in the Cloudflare Pages dashboard
# under Settings > Environment variables
