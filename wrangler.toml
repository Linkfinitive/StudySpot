# Cloudflare Workers with Assets configuration for StudySpot
# This file defines the deployment configuration for Cloudflare Workers with static assets
# See: https://developers.cloudflare.com/workers/configuration/

name = "studyspot"
compatibility_date = "2025-12-15"

# Assets configuration for Workers with Assets
# This specifies the directory containing static files to be deployed
[assets]
directory = "./output/wwwroot"

# Note: The build command (./build.sh) should be configured in the Cloudflare dashboard
# under Settings > Builds & deployments > Build configuration
